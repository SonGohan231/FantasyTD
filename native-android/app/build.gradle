plugins {
    id 'com.android.application'
}
android {
    namespace 'com.indie.fantasytd.forest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.indie.fantasytd.forest'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2.0-forest01-native'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
