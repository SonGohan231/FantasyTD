name: Preserve approved Higgsfield source media

on:
  push:
    branches:
      - recovery/t0012-higgsfield-product-completeness
    paths:
      - ArtSource/Higgsfield/approved-artifacts.json
      - .github/scripts/materialize-approved-higgsfield.py
      - .github/workflows/higgsfield-preserve-approved.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-approved-higgsfield
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/t0012-higgsfield-product-completeness
          fetch-depth: 0
      - name: Preserve byte-verified approved sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/materialize-approved-higgsfield.py
      - name: Commit preserved Unity source assets and provenance
        run: |
          set -euo pipefail
          git config user.name 'FantasyTD Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ArtSource/Higgsfield UnityProject/Assets/FantasyTD/Art/ApprovedSources UnityProject/Assets/FantasyTD/Resources/Higgsfield/Maps
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'T0012: preserve approved Higgsfield source media with verified provenance'
          git pull --rebase origin recovery/t0012-higgsfield-product-completeness
          git push origin HEAD:recovery/t0012-higgsfield-product-completeness
