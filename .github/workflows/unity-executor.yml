      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/UnityProject/Logs"
          "${{ steps.unity.outputs.bin }}"             -batchmode -nographics -quit             -buildTarget Android             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -executeMethod FantasyTD.CI.UnityExecutorCi.BuildAndroid             -logFile "$GITHUB_WORKSPACE/UnityProject/Logs/unity-android-build.log"

      - name: Upload APK and executor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-td-android-${{ github.run_id }}
          if-no-files-found: error
          path: |
            UnityProject/Builds/Android/*.apk
            UnityProject/Artifacts/UnityExecutor/**
            UnityProject/Logs/**

