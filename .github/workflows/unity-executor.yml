name: Dyrygent Unity Executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Unity action to execute
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - tests
          - map-a-integrity
          - mobile-planting
          - plant-behaviors
          - enemy-wave-flow
          - boss-end-states
          - mobile-layout
          - playable-release
          - full-campaign
          - visual-acceptance
          - android-build
  push:
    branches:
      - main
      - 'codex/**'
      - 'dyrygent/**'
      - 'recovery/**'
    paths:
      - 'UnityProject/**'
      - '.dyrygent/unity-request.json'
      - '.github/workflows/unity-executor.yml'
  pull_request:
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-executor.yml'

concurrency:
  group: unity-executor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

env:
  UNITY_VERSION: 6000.0.26f1
  PROJECT_PATH: UnityProject

jobs:
  prepare:
    name: Resolve executor mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: resolve
        name: Resolve mode
        shell: bash
        run: |
          MODE="baseline"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]] && git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qx '.dyrygent/unity-request.json'; then
            REQUESTED="$(jq -r '.mode // "baseline"' .dyrygent/unity-request.json)"
            case "$REQUESTED" in
              baseline|tests|map-a-integrity|mobile-planting|plant-behaviors|enemy-wave-flow|boss-end-states|mobile-layout|playable-release|full-campaign|visual-acceptance|android-build) MODE="$REQUESTED" ;;
              *) echo "Invalid Unity Executor mode: $REQUESTED"; exit 1 ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Dyrygent Unity Executor mode: $MODE"

  baseline:
    name: Unity baseline / compile
    needs: prepare
    if: needs.prepare.outputs.mode == 'baseline'
    runs-on: [self-hosted, dyrygent-unity]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Materialize Higgsfield art
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/materialize-higgsfield-art.sh

      - name: Locate Unity Editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_BIN="$(find "$HOME" /opt -type f -path "*/6000.0.26f1/Editor/Unity" -perm -111 2>/dev/null | head -n 1)"
          if [[ -z "$UNITY_BIN" ]]; then
            echo "Unity 6000.0.26f1 executable not found."
            unity editors --installed || true
            exit 1
          fi
          echo "bin=$UNITY_BIN" >> "$GITHUB_OUTPUT"
          echo "Using Unity: $UNITY_BIN"
          "$UNITY_BIN" -version

      - name: Run Dyrygent Unity baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/UnityProject/Logs"
          "${{ steps.unity.outputs.bin }}"             -batchmode -nographics -quit             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -executeMethod FantasyTD.CI.UnityExecutorCi.Baseline             -logFile "$GITHUB_WORKSPACE/UnityProject/Logs/unity-baseline.log"

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-executor-baseline-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            UnityProject/Artifacts/UnityExecutor/**
            UnityProject/Logs/**

  tests:
    name: Unity EditMode + PlayMode tests
    needs: prepare
    if: needs.prepare.outputs.mode == 'tests'
    runs-on: [self-hosted, dyrygent-unity]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Materialize Higgsfield art
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/materialize-higgsfield-art.sh

      - name: Locate Unity Editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_BIN="$(find "$HOME" /opt -type f -path "*/6000.0.26f1/Editor/Unity" -perm -111 2>/dev/null | head -n 1)"
          if [[ -z "$UNITY_BIN" ]]; then
            echo "Unity 6000.0.26f1 executable not found."
            exit 1
          fi
          echo "bin=$UNITY_BIN" >> "$GITHUB_OUTPUT"

      - name: Run EditMode tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/UnityProject/TestResults" "$GITHUB_WORKSPACE/UnityProject/Logs"
          "${{ steps.unity.outputs.bin }}"             -batchmode -nographics             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -runTests -testPlatform EditMode             -testResults "$GITHUB_WORKSPACE/UnityProject/TestResults/editmode.xml"             -logFile "$GITHUB_WORKSPACE/UnityProject/Logs/unity-editmode.log"

      - name: Run PlayMode tests
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.unity.outputs.bin }}"             -batchmode -nographics             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -runTests -testPlatform PlayMode             -testResults "$GITHUB_WORKSPACE/UnityProject/TestResults/playmode.xml"             -logFile "$GITHUB_WORKSPACE/UnityProject/Logs/unity-playmode.log"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-executor-tests-${{ github.run_id }}
          if-no-files-found: warn
