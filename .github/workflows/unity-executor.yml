name: Dyrygent Unity Executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Unity action to execute
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - tests
          - android-build
  push:
    branches:
      - main
      - 'codex/**'
      - 'dyrygent/**'
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-executor.yml'
  pull_request:
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-executor.yml'

concurrency:
  group: unity-executor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.0.26f1
  PROJECT_PATH: UnityProject

jobs:
  baseline:
    name: Unity baseline / compile
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Dyrygent Unity baseline
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: FantasyTD.CI.UnityExecutorCi.Baseline
          allowDirtyBuild: true

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-executor-baseline-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            UnityProject/Artifacts/UnityExecutor/**
            UnityProject/Logs/**

  tests:
    name: Unity EditMode + PlayMode tests
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-executor-tests-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/**
            UnityProject/Artifacts/**
            UnityProject/TestResults/**

  android:
    name: Unity Android APK
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'android-build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: unity-android-${{ env.UNITY_VERSION }}-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            unity-android-${{ env.UNITY_VERSION }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: FantasyTD.CI.UnityExecutorCi.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK and executor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-td-android-${{ github.run_id }}
          if-no-files-found: error
          path: |
            UnityProject/Builds/Android/*.apk
            UnityProject/Artifacts/UnityExecutor/**
